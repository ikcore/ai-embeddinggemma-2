[package]
name = "embeddinggemma_api"
description = "Axum HTTP service for EmbeddingGemma 2 multimodal embeddings (GAISe-compatible /v1/embeddings and /v1/embeddings/contents, Gemini-API-style embedContent)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "embeddinggemma_api"
path = "src/main.rs"

[dependencies]
embeddinggemma_core = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["hf-hub"]
hf-hub = ["embeddinggemma_core/hf-hub"]
cuda = ["embeddinggemma_core/cuda"]
cudnn = ["embeddinggemma_core/cudnn"]
metal = ["embeddinggemma_core/metal"]
accelerate = ["embeddinggemma_core/accelerate"]
mkl = ["embeddinggemma_core/mkl"]
mlx = ["embeddinggemma_core/mlx"]
