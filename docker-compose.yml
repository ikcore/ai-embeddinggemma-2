# ai-embeddinggemma-2 — Docker Compose
#
#   docker compose run --rm download                # fill the weights volume once (1.5 GB)
#   docker compose up -d                            # CUDA (bf16), http://localhost:3000
#   docker compose --profile cpu up -d embeddinggemma-cpu   # CPU image instead
#
# GPU services need the NVIDIA Container Toolkit (Docker Desktop on Windows
# ships it); the `deploy.resources.reservations.devices` block attaches the GPU.
#
# Overrides via environment / .env: CUDA_COMPUTE_CAP (89 = RTX 40xx, 86 = RTX 30xx,
# 80 = A100, 90 = H100), EMBEDDINGGEMMA_PORT (host port, 3000) and the
# EMBEDDINGGEMMA_* server variables listed in the README.

services:
  embeddinggemma:
    build:
      context: .
      dockerfile: docker/Dockerfile.cuda
      args:
        CUDA_COMPUTE_CAP: ${CUDA_COMPUTE_CAP:-89}
    image: embeddinggemma-api:cuda
    ports:
      - "${EMBEDDINGGEMMA_PORT:-3000}:3000"
    environment:
      EMBEDDINGGEMMA_MODELS: ${EMBEDDINGGEMMA_MODELS:-embeddinggemma-2}
      EMBEDDINGGEMMA_MODALITIES: ${EMBEDDINGGEMMA_MODALITIES:-all}
      EMBEDDINGGEMMA_LOG_REQUESTS: ${EMBEDDINGGEMMA_LOG_REQUESTS:-true}
    volumes:
      - embeddinggemma-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  embeddinggemma-cpu:
    profiles: [cpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: embeddinggemma-api:cpu
    ports:
      - "${EMBEDDINGGEMMA_PORT:-3000}:3000"
    environment:
      EMBEDDINGGEMMA_MODELS: ${EMBEDDINGGEMMA_MODELS:-embeddinggemma-2}
      EMBEDDINGGEMMA_MODALITIES: ${EMBEDDINGGEMMA_MODALITIES:-all}
      EMBEDDINGGEMMA_LOG_REQUESTS: ${EMBEDDINGGEMMA_LOG_REQUESTS:-true}
    volumes:
      - embeddinggemma-models:/models
    restart: unless-stopped

  # One-shot: fetch the weights into the shared volume.
  download:
    profiles: [download]
    image: embeddinggemma-api:cpu
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    entrypoint: ["/usr/local/bin/embeddinggemma_api", "download"]
    command: ["embeddinggemma-2"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - embeddinggemma-models:/models

# A named volume rather than a bind mount of ./models: on Docker Desktop for
# Windows a bind mount goes through a slow 9p bridge.
volumes:
  embeddinggemma-models:
